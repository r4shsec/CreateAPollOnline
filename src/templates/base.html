<!doctype html>
<html lang="en" data-theme="dracula">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Create a Poll Online{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/images/logo.svg" />
    <!-- daisyUI components -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=home,search,delete,link,qr_code_scanner,lock"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/styles/theme.css" />
    <link rel="stylesheet" href="/static/styles/custom.css" />
  </head>

  <body class="min-h-screen flex flex-col bg-base-200">
    <!-- Navbar: sits on a darker surface than the page so it reads as its own layer -->
    <header
      class="sticky top-0 z-50 border-b border-base-content/10 bg-base-100/80 backdrop-blur"
    >
      <nav class="navbar mx-auto w-full max-w-6xl px-4 sm:px-6 min-h-16">
        <div class="navbar-start">
          <a
            href="/"
            class="flex items-center gap-3 rounded-lg px-1 py-1 transition-opacity hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
            aria-label="Create a Poll – home"
          >
            <img
              src="/static/images/logo.svg"
              alt=""
              width="40"
              height="40"
              class="size-10 shrink-0"
            />
            <span class="text-xl font-semibold tracking-tight">
              Create A Poll
            </span>
          </a>
        </div>

        <div class="navbar-end">
          <ul class="menu menu-horizontal gap-1 px-1">
            <li>
              <a href="/" class="rounded-lg font-medium">
                <span class="material-symbols-outlined text-[20px]">home</span>
                <span class="max-sm:hidden">Home</span>
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <!-- Content is centered in the remaining space instead of being pushed down by a big margin -->
    <main class="flex-1 flex flex-col justify-center px-4 py-10">
      {% block content %} {% endblock %}
    </main>

    <footer class="border-t border-base-content/10 bg-base-100 py-5">
      <p class="text-center text-sm text-base-content/60">
      </p>
    </footer>

    {% block scripts %} {% endblock %}
  </body>
</html>
